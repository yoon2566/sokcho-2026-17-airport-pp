const wish=new THREE.Vector3(side*2.8,vertical*2.1,-forward*4.5).applyAxisAngle(new THREE.Vector3(0,1,0),-s.h);const damping=1-Math.exp(-dt*(brake?9:4));s.vx=lerp(s.vx,brake?0:wish.x,damping);s.vy=lerp(s.vy,brake?0:wish.y,damping);s.vz=lerp(s.vz,brake?0:wish.z,damping);s.wind=$('weather').value==='rain'?.11*Math.sin(s.elapsed*.37):0;s.x+=(s.vx+s.wind)*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.pitch=lerp(s.pitch,forward*.095,1-Math.exp(-dt*4));s.bank=lerp(s.bank,-side*.11,1-Math.exp(-dt*4));s.battery=Math.max(0,100-s.elapsed/CONFIG.drone.limitSeconds*100-s.hits*2);
const current=new THREE.Vector3(s.x,s.y,s.z);for(const c of course){const cross=ringCrossing(prev,current,c);if(cross.crossed){if(c.passed){event('duplicate_ignored',{ring:c.id});continue}if(cross.radial<=CONFIG.drone.innerRadius-CONFIG.drone.bodyClearance){c.passed=true;s.passed++;const marker=c.obj.getObjectByName('Ring_PassMarker');if(marker)marker.visible=true;c.rig.play('Ring_PassFeedback');c.obj.traverse(o=>{if(o.isMesh){const list=Array.isArray(o.material)?o.material:[o.material];o.material=list.map(m=>{m=m.clone();if(m.name==='Amber'){m.color.set('#81c8b1');if(m.emissive)m.emissive.set('#81c8b1')}return m});if(o.material.length===1)o.material=o.material[0]}});event('ring_pass',{ring:c.id,total:s.passed,radial:cross.radial});toast(`링 ${c.id} 통과 · ${s.passed} / 20`);sound(460+s.passed*17);if(s.passed===20){finish('success','서로 다른 20개 링의 빈 내부를 실제로 관통했습니다.');return}}else{c.missed=true;s.misses++;if(cross.radial<3.61){s.hits++;toast('테두리에 닿았습니다 · 멈추고 중심으로 재접근','#f5b653');sound(160,.16,.07);event('rim_contact',{ring:c.id,radial:cross.radial})}else{toast(`링 ${c.id}을 놓쳤습니다 · 뒤로 이동해 다시 접근`,'#f5b653');event('ring_missed',{ring:c.id,radial:cross.radial})}}}}
if(s.y<.30)finish('incomplete','지면에 닿았습니다. 고도와 전방 시야를 맞추어 다시 비행하세요.');else if(s.y>24||Math.abs(s.x)>80||s.z>70||s.z<-430)finish('incomplete','연습 구역을 벗어났습니다. 다음 링을 지도에서 확인하세요.');else if(s.battery<=0)finish(droneResult(s.passed),'배터리 연습 시간이 끝났습니다. 현재 통과 수를 기록했습니다.');
}
function updateObjects(dt){if(!state)return;const s=state;if(mode==='flight'){plane.position.set(s.x,s.y+2.13,-s.d);plane.rotation.set(s.pitch,-s.h,-s.bank,'YXZ');cockpit.position.copy(plane.position);cockpit.rotation.copy(plane.rotation);plane.visible=(!active||s.phase==='boarding'||s.phase==='clearance');cockpit.visible=active&&s.phase!=='boarding'&&s.phase!=='clearance';
for(const name of ['YokeRollPivot-1','YokeRollPivot1']){const o=cockpit.getObjectByName(name);if(o)o.rotation.z=s.bank*.7}for(const name of ['YokePitchPivot-1','YokePitchPivot1']){const o=cockpit.getObjectByName(name);if(o)o.rotation.x=-s.pitch}for(const name of ['ThrottlePivot-1','ThrottlePivot1']){const o=cockpit.getObjectByName(name);if(o)o.rotation.x=rad(20-45*s.throttle)}
}else{drone.position.set(s.x,s.y,s.z);drone.rotation.set(-s.pitch,-s.h,s.bank,'YXZ');plane.visible=false;cockpit.visible=false;drone.visible=thirdPerson||!active;}}
function updateCamera(dt){if(!state||!mode)return;if(mode==='flight'){if(!active||state.phase==='boarding'||state.phase==='clearance'){const p=plane.position;camera.up.set(0,1,0);camera.position.copy(p).add(new THREE.Vector3(21,12,24));camera.lookAt(p.clone().add(new THREE.Vector3(0,2,0)))}else{const local=new THREE.Vector3(0,1.52,.7);camera.position.copy(cockpit.localToWorld(local));const aim=cockpit.localToWorld(new THREE.Vector3(0,1.34,-15));camera.up.set(0,1,0).applyQuaternion(cockpit.quaternion);camera.lookAt(aim)}}else{camera.up.set(0,1,0);if(thirdPerson||!active){const offset=new THREE.Vector3(0,2.5,6).applyAxisAngle(new THREE.Vector3(0,1,0),-state.h);camera.position.copy(drone.position).add(offset);camera.lookAt(drone.position.clone().add(new THREE.Vector3(Math.sin(state.h)*4,0,-Math.cos(state.h)*4)))}else{camera.position.copy(drone.position).add(new THREE.Vector3(0,.16,-.5).applyAxisAngle(new THREE.Vector3(0,1,0),-state.h));const ahead=new THREE.Vector3(Math.sin(state.h),-.025,-Math.cos(state.h));camera.lookAt(camera.position.clone().add(ahead));camera.rotateZ(state.bank*.3)}}if(rainParticles){rainParticles.position.copy(camera.position);const positions=rainParticles.geometry.attributes.position;for(let i=0;i<positions.count;i++){positions.array[i*3+1]-=dt*20;if(positions.array[i*3+1]<-8)positions.array[i*3+1]=36}positions.needsUpdate=true}}
const mapctx=$('map').getContext('2d');
function drawMap(){const ctx=mapctx;ctx.clearRect(0,0,368,316);ctx.fillStyle='#102b3b';ctx.fillRect(0,0,368,316);ctx.strokeStyle='#335362';ctx.lineWidth=1;for(let x=24;x<360;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,316);ctx.stroke()}for(let y=0;y<316;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(368,y);ctx.stroke()}let xy;
if(mode==='flight'){const coord=(x,d)=>[184+x*.22,286-(d+200)/6600*260];ctx.strokeStyle='#81c8b1';ctx.lineWidth=3;ctx.beginPath();for(let d=-200;d<6400;d+=80){const p=coord(routeX(d),d);if(d===-200)ctx.moveTo(...p);else ctx.lineTo(...p)}ctx.stroke();ctx.fillStyle='#dce7ee';ctx.font='18px Segoe UI';ctx.fillText('ICN',207,287);ctx.fillText('CJU',207,38);xy=coord(state.x,state.d)}else{const coord=(x,z)=>[184+x*5,286-(6-z)/380*266];for(const c of course){const [x,y]=coord(c.pos.x,c.pos.z);ctx.strokeStyle=c.passed?'#81c8b1':c.missed?'#f5b653':'#5dd5f5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.stroke()}xy=coord(state.x,state.z)}ctx.save();ctx.translate(...xy);ctx.rotate(state.h);ctx.fillStyle='#f5b653';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(7,9);ctx.lineTo(0,5);ctx.lineTo(-7,9);ctx.closePath();ctx.fill();ctx.restore()}
function updateHUD(){if(!state||!active)return;const s=state;$('compass').textContent=`N　${heading(s.h).toFixed(0).padStart(3,'0')}°　E`;if(mode==='flight'){
$('speed').textContent=Math.round(s.speed*1.944);$('alt').textContent=Math.round(s.y);$('third').textContent=s.vy.toFixed(1);$('fourth').textContent=Math.round(s.throttle*100);$('mapProgress').textContent=`${Math.round(clamp((s.d+100)/5700,0,1)*100)}%`;

const ref=referenceAltitude(s.d),rx=routeX(s.d+220),courseHeading=heading(Math.atan2(rx-s.x,220));$('target').textContent=s.phase==='approach'?`착륙 경로 ${Math.round(ref)}m · 000°`:`관제 고도 ${Math.round(ref)}m · ${Math.round(courseHeading).toString().padStart(3,'0')}°`;$('deviation').textContent=`항로 ${Math.abs(s.x-routeX(s.d)).toFixed(0)}m ${s.x>routeX(s.d)?'오른쪽':'왼쪽'} · ${s.y>ref?'높음':'낮음'} ${Math.abs(s.y-ref).toFixed(0)}m`;$('gearInfo').textContent=`기어 ${s.gear?'내려짐':'올라감'} · ${$('weather').value==='rain'?'비 / 약한 횡풍':'맑음'}`;$('gearInfo').classList.toggle('critical',s.phase==='approach'&&!s.gear);$('cue').textContent=s.phase==='approach'?`${Math.max(0,Math.round(5600-s.d))}m 뒤 활주로 · ${s.y>ref+5?'하강을 더 조절':s.y<ref-5?'기수를 조금 올리세요':'하강 경로 유지'}`:(s.phase==='boarding'||s.phase==='clearance'?'절차 확인 Enter':s.phase==='route'?'고도 · 지도 · 관제 방향을 함께 확인':'');
}else{$('speed').textContent=Math.hypot(s.vx,s.vz).toFixed(1);$('alt').textContent=s.y.toFixed(1);$('third').textContent=s.passed;$('fourth').textContent=Math.ceil(s.battery);$('mapProgress').textContent=`${s.passed}/20`;const c=course.find(c=>!c.passed);if(c){const delta=c.pos.clone().sub(new THREE.Vector3(s.x,s.y,s.z));const angle=wrap(Math.atan2(delta.x,-delta.z)-s.h);$('target').textContent=`다음 링 ${c.id} · ${delta.length().toFixed(0)}m`;$('deviation').textContent=`목표 고도 ${c.pos.y.toFixed(1)}m · ${Math.abs(deg(angle)).toFixed(0)}° ${angle>0?'오른쪽':'왼쪽'}`;$('cue').textContent=Math.abs(angle)>rad(85)?'놓친 링은 S로 후진하거나 Q/E로 돌아 재접근':delta.y>.6?'↑ 고도를 올리세요':delta.y<-.6?'↓ 고도를 낮추세요':Math.abs(delta.x)>.7?'A/D로 빈 중심에 정렬':'빈 중심 통과 · W 전진'}$('instruction').textContent=`정밀 링 통과 · ${s.passed} / 20`;$('detail').textContent=`테두리 스침은 집계하지 않습니다 · 남은 연습 ${Math.ceil(Math.max(0,210-s.elapsed))}초`;$('gearInfo').textContent=`고유 링 한 번만 집계 · ${thirdPerson?'외부 시야':'FPV 시야'}`;}
